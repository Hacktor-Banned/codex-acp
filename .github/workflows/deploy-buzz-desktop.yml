name: Deploy Buzz desktop Codex adapter

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the current main build or restore a local backup
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      backup_name:
        description: Backup directory reported by an earlier deploy (rollback only)
        required: false
        type: string
      confirmation:
        description: Type DEPLOY_BUZZ_CODEX_ACP
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-buzz-desktop-codex-acp
  cancel-in-progress: false

jobs:
  deploy:
    name: self-hosted build, test, and deploy
    runs-on: [self-hosted, macOS, ARM64, buzz-desktop-mac-studio]
    timeout-minutes: 30
    steps:
      - name: Validate dispatch and runner
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'DEPLOY_BUZZ_CODEX_ACP'
          test "$RUNNER_NAME" = 'mac-studio-buzz-codex-acp'
          test "$(uname -s)" = 'Darwin'
          test "$(uname -m)" = 'arm64'
          case "$OPERATION" in
            deploy|rollback) ;;
            *) exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Use the Node runtime managed by Buzz
        shell: bash
        run: |
          set -euo pipefail
          buzz_root='/Users/tobiasschluter/Library/Application Support/Buzz'
          node_bin="$(find "$buzz_root/runtimes/node" -type f -path '*/darwin-arm64/bin/node' -perm -111 -print | sort | tail -n 1)"
          test -n "$node_bin"
          test -x "$node_bin"
          node_dir="$(dirname "$node_bin")"
          test -x "$node_dir/npm"
          echo "$node_dir" >> "$GITHUB_PATH"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: inputs.operation == 'deploy'
        run: npm ci

      - name: Typecheck
        if: inputs.operation == 'deploy'
        run: npm run typecheck

      - name: Run unit tests
        if: inputs.operation == 'deploy'
        run: npm test

      - name: Build package
        if: inputs.operation == 'deploy'
        run: npm run build

      - name: Assemble complete runtime tree
        if: inputs.operation == 'deploy'
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_tree="$RUNNER_TEMP/codex-acp-runtime"
          test ! -e "$runtime_tree"
          mkdir -p "$runtime_tree"
          cp package.json package-lock.json README.md LICENSE "$runtime_tree/"
          cp -R dist "$runtime_tree/"
          (
            cd "$runtime_tree"
            npm ci \
              --omit=dev \
              --ignore-scripts \
              --no-audit \
              --no-fund
          )
          test -f "$runtime_tree/node_modules/@openai/codex/package.json"
          node --check "$runtime_tree/dist/index.js"
          echo "runtime_tree=$runtime_tree" >> "$GITHUB_OUTPUT"

      - name: Deploy or roll back local Buzz adapter
        id: install
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          DEPLOY_TREE: ${{ steps.runtime.outputs.runtime_tree }}
          BACKUP_NAME: ${{ inputs.backup_name }}
        run: scripts/deploy-buzz-desktop-adapter.sh "$OPERATION"

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          BACKUP_NAME: ${{ steps.install.outputs.backup_name }}
          INSTALLED_VERSION: ${{ steps.install.outputs.installed_version }}
          INSTALLED_SHA256: ${{ steps.install.outputs.installed_sha256 }}
        run: |
          {
            echo '## Buzz desktop Codex adapter'
            echo
            echo "- Runner: $RUNNER_NAME"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Operation: $OPERATION"
            echo "- Rollback backup: ${BACKUP_NAME:-not-created}"
            echo "- Installed version: ${INSTALLED_VERSION:-not-verified}"
            echo "- Installed dist SHA-256: ${INSTALLED_SHA256:-not-verified}"
          } >> "$GITHUB_STEP_SUMMARY"
